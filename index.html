<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Season 26/27 — Training Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1014;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--grid:#242934;--text:#eceef2;--sub:#b9bfca;--muted:#8d95a3;
  --accent:#c6f432;
  /* sport palette — validated (dark, surface #171a21, adjacent order swim·run·bike·strength·brick) */
  --swim:#3987e5;--run:#d95926;--bike:#199e70;--strength:#c98500;--brick:#d55181;--race:#c6f432;
  --good:#22c55e;--warn:#eab308;--crit:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;letter-spacing:-.01em}
h2.sec{font-size:17px;margin:20px 2px 10px}
.mono{font-family:Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 100px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}
header.top h1{font-size:24px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.chip b{color:var(--accent)}
.banner{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#2a3310,#1a1f12);border:1px solid #4a5a14;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.banner .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.banner button{margin-left:auto;background:var(--accent);color:#111;border:0;border-radius:10px;padding:7px 12px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wknav button{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px}
.wknav .t{flex:1;text-align:center}.wknav .t .d{font-family:"Bricolage Grotesque";font-weight:700;font-size:17px}
.phase{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:6px;background:#263010;color:var(--accent)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tot{background:var(--card2);border-radius:10px;padding:8px}.tot .v{font-family:Figtree;font-variant-numeric:tabular-nums;font-size:15px}.tot .l{font-size:11px;color:var(--muted)}
.day{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .dn{text-align:center}.day .dn .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.day .dn .n{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px}
.day.today .dn .n{color:var(--accent)}.day.past{opacity:.75}
.wo{display:block;width:100%;text-align:left;background:var(--card2);border:0;border-radius:12px;padding:10px 12px;margin-bottom:6px;border-left:4px solid var(--c,#555)}
.wo:last-child{margin-bottom:0}
.wo .h{display:flex;align-items:center;gap:7px}
.wo .ttl{font-weight:600}
.wo .meta{margin-left:auto;font-family:Figtree;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);white-space:nowrap}
.wo .one{font-size:13px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wo .more{font-size:11.5px;color:var(--accent);margin-top:4px}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.tag.key{color:#111;background:var(--accent)}.tag.slot{color:var(--muted);border:1px solid var(--line);font-weight:500}
.st-done{color:var(--good)}.st-miss{color:var(--crit)}.st-shift{color:var(--warn)}
.restday{color:var(--muted);font-size:13px;padding:8px 2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:7px 2px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
.badge{position:absolute;top:2px;left:56%;background:var(--crit);color:#fff;border-radius:999px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
/* roadmap */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.blk{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .rail{border-radius:3px}
.blk.cur .t1{color:var(--accent)}
.prog{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:8px}.prog>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.race{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.race .cd{background:var(--card2);border-radius:12px;text-align:center;padding:8px 4px}
.race .cd .n{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;color:var(--accent)}.race .cd .l{font-size:10px;color:var(--muted)}
.race h3{font-size:16px}
.goal{font-family:Figtree;font-variant-numeric:tabular-nums;font-size:14px;color:var(--accent)}
.gauge{position:relative;height:8px;border-radius:4px;background:var(--grid);margin:10px 0 4px}
.gauge .f{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.gauge .mk{position:absolute;top:-4px;width:2px;height:16px;background:var(--text)}
.ms{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.ms:first-child{border-top:0}
.ms input{width:18px;height:18px;accent-color:var(--accent)}
.ms.done .lb{color:var(--muted);text-decoration:line-through}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.t4{grid-template-columns:repeat(4,1fr)}
@media(max-width:480px){.tiles.t4{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card2);border-radius:12px;padding:10px}
.tile .v{font-family:Figtree;font-variant-numeric:tabular-nums;font-size:19px}.tile .l{font-size:11px;color:var(--muted)}.tile .s{font-size:11px;color:var(--sub);margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--muted);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--grid);font-family:Figtree;font-variant-numeric:tabular-nums;font-size:12.5px}
table.t th:first-child,table.t td:first-child{text-align:left;font-family:Figtree}
.heat{display:grid;grid-template-columns:28px;grid-template-rows:14px repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;font-size:9.5px}
.heat .c{border-radius:3px;background:var(--grid)}
.heat .wl{color:var(--muted);white-space:nowrap;overflow:visible}
.heat .dl{color:var(--muted);text-align:right;padding-right:4px;line-height:13px}
#tip{position:fixed;pointer-events:none;background:#0b0d10;border:1px solid var(--line);color:var(--text);font-size:12px;padding:7px 9px;border-radius:8px;z-index:60;max-width:240px;display:none;line-height:1.4}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.ov.on{display:block}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;z-index:50;transform:translateY(105%);transition:transform .22s ease;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .in{max-width:720px;margin:0 auto}
.sheet h2{font-size:21px}
.sheet .x{position:absolute;right:14px;top:12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;width:34px;height:34px}
.step{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--grid);font-size:14px}
.step:first-child{border-top:0}.step .k{color:var(--muted);font-size:12.5px;font-weight:600}
.box{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.box .bt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.box ul{margin:4px 0 0;padding-left:18px}.box li{margin:3px 0}
.sg{border:1px solid #4a5a14}
.chg{background:var(--card2);border-radius:12px;padding:10px;margin-top:8px;display:grid;grid-template-columns:24px 1fr;gap:8px}
.chg input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px}
.chg .b{color:var(--muted);text-decoration:line-through;font-size:13px;margin-top:4px}.chg .a{font-size:13px;margin-top:2px}
.chg .why{font-size:12.5px;color:#d9e6a8;margin-top:6px;border-left:2px solid var(--accent);padding-left:8px}
textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit;min-height:70px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.p{background:var(--accent);color:#111}.btn.d{background:#3a1c1c;color:#fca5a5;border:1px solid #5b2626}.btn:disabled{opacity:.45}
.err{color:var(--crit);font-size:13px;margin-top:8px}.okmsg{color:var(--good);font-size:13px;margin-top:8px}
.status{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.s-pending{background:#3a3010;color:var(--warn)}.s-approved{background:#123020;color:var(--good)}.s-rejected{background:#3a1c1c;color:var(--crit)}.s-partial{background:#1c2a3a;color:#7fb4f0}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.note{font-size:13.5px;color:var(--sub);margin-top:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px}.kv .k{color:var(--muted)}
.hide{display:none!important}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--line);color:var(--text)}

/* ===== Dusk summit theme ===== */
:root{--bg:#14122b;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.065);--line:rgba(255,255,255,.085);--grid:rgba(255,255,255,.07);
  --text:#f2f0fa;--sub:#c6c2dc;--muted:#908bad;--accent:#c6f432;--flag:#e0558f;--amber:#f2a65a;--r-hero:28px;--r-card:20px;--r-row:14px}
html,body{background:var(--bg)}
body{background:radial-gradient(130% 55% at 50% -8%,#3a2a63 0%,#231c46 38%,#14122b 72%) fixed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
header.top h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
header.top .sub{color:var(--muted);font-size:13.5px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.chip b{color:var(--accent);font-family:"Bricolage Grotesque";font-weight:800}
.phase{text-transform:none;letter-spacing:0;font-size:12.5px;padding:4px 10px;border-radius:999px}
.wo{background:rgba(255,255,255,.055);border-radius:var(--r-row);border-left:0;padding:12px 14px 12px 12px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.wo .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.wo .ic svg{width:19px;height:19px}
.wo .ttl{font-weight:650;font-size:15px}
.wo .more{display:none}
.day{grid-template-columns:48px 1fr;border-top:1px solid var(--line)}
.day .dn .w{text-transform:none;letter-spacing:0;font-size:12px}
.day .dn .n{font-size:22px}
.day.today .dn .n{color:var(--accent)}
.restday{font-style:italic}
.tot{background:rgba(255,255,255,.05);border-radius:var(--r-row)}
.tot .v{font-family:"Bricolage Grotesque";font-weight:700;font-size:19px}
nav.tabs{background:rgba(20,18,43,.86);border-top:1px solid var(--line)}
nav.tabs button.on{color:var(--text)}
nav.tabs button.on svg{color:var(--accent)}
nav.tabs button.on::after{content:"";position:absolute;left:50%;bottom:1px;width:18px;height:3px;border-radius:2px;background:var(--accent);transform:translateX(-50%)}
.btn.p{background:var(--accent);color:#16142c;border-radius:12px}
.sheet{background:#1b1838;border-top:1px solid var(--line)}
.box{background:rgba(255,255,255,.05);border-radius:var(--r-row)}
.box .bt{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--amber);font-weight:700}
.step{border-top:1px solid var(--line)}
.tile{background:rgba(255,255,255,.05);border-radius:var(--r-row)}
.tile .v{font-family:"Bricolage Grotesque";font-weight:700}
.status{text-transform:none;letter-spacing:0;font-size:12px;border-radius:999px;padding:3px 9px}
h2.sec{font-size:19px;font-weight:800}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-hero);padding:20px 20px 0;margin-bottom:14px;
  background:linear-gradient(165deg,#47337a 0%,#2c2257 48%,#1d1940 100%);border:1px solid rgba(255,255,255,.1)}
.hero .when{color:#d8d1f3;font-size:14px}
.hero h2{font-size:31px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px;max-width:16ch}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;color:#e9e4fb;font-size:14px}
.hero .meta b{font-family:"Bricolage Grotesque";font-size:18px}
.hero .lead{color:#d8d1f3;font-size:14.5px;margin-top:10px;max-width:42ch}
.hero .go{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#16142c;border:0;border-radius:999px;padding:10px 16px;font-weight:700}
.hero .ridge{display:block;width:calc(100% + 40px);margin:16px -20px 0;height:auto}
.hero .sun{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#e6ff7a 0%,#c6f432 35%,rgba(198,244,50,0) 70%);opacity:.55;pointer-events:none}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.strip button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:8px 0 9px;color:var(--text);text-align:center}
.strip button.on{border-color:var(--accent);background:rgba(198,244,50,.09)}
.strip .w{font-size:11.5px;color:var(--muted)}
.strip .n{font-family:"Bricolage Grotesque";font-weight:800;font-size:18px;line-height:1.2}
.strip .dots{display:flex;gap:3px;justify-content:center;height:7px;margin-top:3px}
.strip .dots i{width:7px;height:7px;border-radius:50%}
.strip .past{opacity:.6}
@media (prefers-reduced-motion:no-preference){.hero{animation:rise .5s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ins{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.ins h3{font-size:15.5px;margin:4px 0 6px;line-height:1.3}.ins .fd{font-family:Figtree,system-ui,sans-serif;font-size:13px;color:var(--text);background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.ins p{font-size:13.5px;color:var(--sub);margin:8px 0 0;line-height:1.45}.ins .act{font-size:13.5px;margin-top:8px}.ins .act b{color:var(--accent)}
.vtag{font-size:11.5px;font-weight:700;text-transform:capitalize}
.insh{display:flex;flex-direction:column;gap:10px}.insh .hl{font-family:"Bricolage Grotesque";font-weight:800;font-size:19px;line-height:1.25}
.insg{display:flex;gap:12px;align-items:center}
.ro{padding:9px 0;border-top:1px solid var(--line)}.ro:first-of-type{border-top:0}.ro .bar{height:6px;border-radius:3px;background:var(--grid);margin:7px 0 5px;overflow:hidden}.ro .bar i{display:block;height:100%;border-radius:3px}
.fl{margin:8px 0 0 18px;padding:0;font-size:13.5px;line-height:1.5}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-1px;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.rpbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text)}
.rprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;flex-shrink:0}.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 10px;border-radius:8px}
.seg button.on{background:var(--accent);color:#16142c}.seg button[data-v=busy].on{background:var(--crit);color:#fff}.seg button[data-v=short].on{background:var(--warn);color:#16142c}

.refc{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px}.btn.sm{padding:7px 12px;font-size:13px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bt2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px 8px}.bt2 .bv{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;line-height:1.1}.bt2 .bv span{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.rs{position:relative;height:10px;border-radius:5px;margin:8px 0 3px;overflow:visible;background:var(--grid)}.rs i{position:absolute;top:0;bottom:0}.rs i:first-child{border-radius:5px 0 0 5px}.rs i:nth-child(4){border-radius:0 5px 5px 0}
.rs b,.ib b{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1.5px;background:var(--text);border-radius:2px}
.ib{position:relative;display:flex;height:20px;border-radius:6px;overflow:visible;margin:8px 0 3px;gap:2px}.ib i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#16142c;border-radius:4px}
.rt{padding:10px 0;border-top:1px solid var(--line)}.rt:first-of-type{border-top:0}.rt .bar{height:6px;border-radius:3px;background:var(--grid);margin:7px 0 4px;overflow:hidden}.rt .bar i{display:block;height:100%;border-radius:3px}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}

.hero{padding:20px 20px 18px;background:radial-gradient(120% 90% at 100% 0%,#5b3fa0 0%,rgba(91,63,160,0) 55%),linear-gradient(165deg,#3b2b6e 0%,#251d4d 55%,#171433 100%)}
.hv{display:flex;align-items:center;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.ring{width:118px;height:118px;flex-shrink:0;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}

.hs .hl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:#b9b0de}.hs .hl b{font-family:"Bricolage Grotesque";font-size:18px;color:#fff;font-weight:800}.hs .hl small{font-size:12px;color:#b9b0de;font-weight:600}
.hb{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}.hb i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.hx{font-size:11.5px;color:#b9b0de;margin-top:2px}
.motto{margin-top:14px;font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;color:#f1edff;line-height:1.3}

</style>

<body>

<script>
// ================================================================== constants
const S={desc:{items:{},kinds:{}},weeks:{},suggestions:[],settings:null,actuals:{},metrics:{},notes:[],tab:'week',weekIdx:null,db:null,busy:false,sel:{},statRange:'season'};
const RACE_ORDER=['mazeikiai','kaunas','riga','trakai','tallinn'];
const RACE_META={
  mazeikiai:{tag:'PB attempt',note:'First race of the season and the benchmark for the half-marathon block.'},
  kaunas:{tag:'B race',note:'Home race — run it as a goal-pace rehearsal, not a race. Riga is 3 weeks later.'},
  riga:{tag:'A race · PB',note:'Most important spring race. A healthy start line beats an aggressive goal; sub-1:30 is a future-season target.'},
  trakai:{tag:'Debut',note:'Swim is the limiter — swimming runs through the whole plan from week 1, open water in June.'},
  tallinn:{tag:'A race · PB',note:'Season finale.'}};
const SPORTS=['swim','run','bike','strength','brick'];
const SP={swim:['Swim','var(--swim)'],run:['Run','var(--run)'],bike:['Bike','var(--bike)'],strength:['Strength','var(--strength)'],brick:['Brick','var(--brick)'],race:['Race','var(--race)']};
const BLOCKS=[
  {name:'Recovery',from:'2026-11-16',to:'2026-11-29',col:'#5b6372',why:'Heal from Larnaka. Strength-only first week, then easy running and a CSS swim test.',targets:['Pain-free easy running','CSS swim test']},
  {name:'Base',from:'2026-11-30',to:'2027-01-03',col:'#2f8f5f',why:'Aerobic engine, upper-body strength season (2×/week), swim technique.',targets:['1500 m swim non-stop','Long run 16 km easy','Push-up baseline']},
  {name:'10K block',from:'2027-01-04',to:'2027-02-16',col:'#d95926',why:'VO₂max + threshold for a Mažeikiai PB.',targets:['VDOT 44.5','Mažeikiai sub-45:00','CSS 1:45/100 m']},
  {name:'Half block',from:'2027-02-17',to:'2027-05-16',col:'#c98500',why:'Threshold & HM-pace volume. Kaunas = rehearsal, Riga = A race.',targets:['Kaunas ≈1:40 controlled','Riga sub-1:35','Long run 22 km']},
  {name:'Tri block',from:'2027-05-17',to:'2027-06-27',col:'#3987e5',why:'Bike training, bricks and open-water swimming for the Trakai debut.',targets:['1000 m open water','Bricks without leg panic','Finish Trakai']},
  {name:'Marathon block',from:'2027-06-28',to:'2027-09-12',col:'#d55181',why:'MP volume and long runs to 32 km for Tallinn.',targets:['32 km long run','Tallinn sub-3:38']},
];
// coaching library by workout kind (used for the detail sheet)
const KIND={
  easy:{why:'Builds the aerobic engine, capillaries and tendon durability with very low injury risk. This is most of your running — it makes the hard days possible.',feel:'Zone 2 · RPE 3–4/10 · you could hold a full conversation',cues:['Relaxed shoulders, quick light steps (~170–180 spm)','On hills, keep the effort, not the pace','Finishing feeling like you could do it again = perfect'],tired:'Cut to 20–25\' or swap for a 30\' easy spin. Never "make up" easy km later.'},
  strides:{why:'Easy aerobic running plus short, fast, relaxed strides that teach good mechanics and keep leg speed — without any fatigue cost.',feel:'Run: Zone 2 · Strides: fast but smooth (~90 %), never a sprint',cues:['Accelerate over 5–6", hold, float, decelerate','Full recovery between strides','Tall posture, hands relaxed'],tired:'Keep the strides, cut the run to 20\'.'},
  long:{why:'The single biggest endurance driver: better fat burning, glycogen storage, muscle and tendon resilience, and mental toughness for the late race.',feel:'Zone 2 · RPE 4 · segments as written',cues:['Start slower than you think','Practise race fuelling on every long run over 90\'','Segments only if the easy part felt easy'],tired:'Cut 20–25 % and keep it all easy. A missed long run is never doubled the next week.',fuel:'Over 75\': water + SIS Beta Fuel every 30–35\' from minute 40.'},
  steady:{why:'A gentle step up from easy running — teaches you to run relaxed at moderate effort after the marathon break.',feel:'Upper Zone 2 / low Zone 3 · RPE 5 · short sentences',cues:['Should feel controlled the whole time','Stop the steady part if form falls apart'],tired:'Run it all easy.'},
  fartlek:{why:'Unstructured speed play that reintroduces faster running in a forgiving format during base.',feel:'Surges RPE 7 (threshold feel) · jogs RPE 3',cues:['Surges by feel, not by watch','Jog recoveries, never stop'],tired:'Halve the surges.'},
  hills:{why:'Short maximal hill sprints build power and stiffness in calves/Achilles with almost no fatigue.',feel:'Sprints all-out but relaxed · full walk-down recovery',cues:['Drive knees, push the ground back','6–8 % hill, 10" only'],tired:'Do 4 sprints and the easy run.'},
  intervals:{why:'Raises VO₂max and running economy — the ceiling for your 10K and half-marathon.',feel:'Zone 4–5 · RPE 8 · controlled hard — the last rep should be as fast as the first',cues:['Recoveries are jogs, not stops','Run the first rep slightly conservatively','Flat route or track'],tired:'Drop 2 reps or turn it into fartlek by feel. Low HRV + heavy legs → skip and add a note.'},
  'intervals-10k':{why:'Teaches goal 10K pace until it feels routine — confidence and pace judgement for Mažeikiai.',feel:'Exactly goal pace · RPE 7–8',cues:['Hit pace in the first 200 m, then lock it','Count breaths to stay relaxed'],tired:'Drop the last rep.'},
  threshold:{why:'Raises your lactate threshold — the pace you can hold for ~60 minutes. The key workout for the half and marathon.',feel:'Zone 3–4 border · RPE 7 · "comfortably hard", 3–4 word sentences',cues:['Even pacing — the end should feel like the start','If HR keeps climbing, ease off 5 s/km'],tired:'Do 2/3 of the threshold time.'},
  cruise:{why:'Threshold split into reps with short jogs — more time at threshold with less strain.',feel:'Zone 3–4 border · RPE 7',cues:['Short 1\' jogs — keep moving','Same pace every rep'],tired:'Drop 1–2 reps.'},
  hmp:{why:'Race-specific practice for Riga: goal half-marathon pace until it feels automatic.',feel:'Goal HM pace · RPE 7',cues:['Practise race breakfast and gels','Watch shows pace — but check effort is sustainable'],tired:'Shorten the goal-pace segments by a third.'},
  mp:{why:'Marathon-specific endurance: goal pace on tired legs, practising fuelling and patience.',feel:'Goal marathon pace · RPE 6',cues:['Take a gel mid-session on long ones','Relaxed — this pace must feel easy for 42 km'],tired:'Do half the MP km.',fuel:'Over 60\': one gel at the midpoint.'},
  shakeout:{why:'Loosens the legs before a race without adding fatigue.',feel:'Very easy',cues:['Short and relaxed'],tired:'Skip it — rest is fine too.'},
  race:{why:'Race day. Everything in the block was built for this.',feel:'Per the pacing plan below',cues:['Nothing new on race day','Warm up properly','Start conservative — finish strong'],tired:'Talk to the coach (leave a note) if you are ill or injured in race week.'},
  'swim-found':{why:'Technique foundations: balance, a long stroke and a relaxed exhale. Getting these habits right now makes every later session easier.',feel:'Easy · full focus on form',cues:['One focus at a time','Blow out all your air under water so the breath is quick','Long reach, pull back to the hip'],tired:'Drills + 4×25 m only.'},
  'swim-kick':{why:'A small steady kick and a balanced body position keep your legs up, which makes front crawl far less tiring.',feel:'Easy',cues:['Kick from the hips, not the knees','Floppy ankles, small kicks','Head down = legs up'],tired:'Kick and side kick only.'},
  'swim-link':{why:'Linking lengths: turning 25 m pieces into 50 m pieces without panic. This is where front crawl starts to feel possible.',feel:'Easy · breathing calm',cues:['Slow down rather than stop','Long reach forward each stroke','Breathe out all the way before you turn to breathe'],tired:'Swim 4×50 instead of 6.'},
  'swim-link2':{why:'Longer pieces at an easy pace teach your body that you can keep going.',feel:'Easy',cues:['Count strokes per length','Rest as long as you need between pieces'],tired:'Cut the ladder at the 75 m.'},
  'swim-check':{why:'A simple progress check: how far you can swim front crawl without stopping. The plan adapts to your result.',feel:'Easy, relaxed — this is not a race',cues:['Start slower than you think','Leave the result as a note in the app'],tired:'Do the check another day.'},
  'swim-build':{why:'100 m pieces build the endurance to hold front crawl for longer, with short rests to keep form good.',feel:'Easy–steady',cues:['Same pace for every 100','Breathe every 2 or 3 strokes — whatever keeps you calm'],tired:'4×100 instead of 6.'},
  'swim-cont':{why:'Continuous swimming: 200 m without stopping is the first big step towards the 750 m race swim.',feel:'Steady but relaxed',cues:['Find a pace you could keep forever','A few breaststrokes to reset are fine'],tired:'1×200 + 4×50.'},
  'swim-cont2':{why:'Stretching the continuous swim to 300–400 m. Each week a little longer.',feel:'Easy, even',cues:['Add 50 m per week','Same rhythm from first to last length'],tired:'Do 300 m continuous.'},
  'swim-race1':{why:'200 m pieces at steady pace build race-pace endurance once you can swim continuously.',feel:'Steady · RPE 5–6',cues:['Even pace on all four','Bilateral breathing if comfortable'],tired:'3×200.'},
  'swim-long':{why:'The long continuous swim grows towards race distance — 750 m non-stop by mid-May.',feel:'Easy, relaxed',cues:['Sight in the second half','Never sprint — this is about time in the water'],tired:'Swim the distance you did last time, not more.'},
  'swim-tri':{why:'Race rehearsal: 750 m non-stop with sighting, plus a faster start.',feel:'Relaxed race effort',cues:['Settle into rhythm in the first 100 m','Sight every 6–8 strokes'],tired:'500 m continuous.'},
  'swim-easy':{why:'Easy technique swim that keeps your feel for the water during the marathon block.',feel:'Easy',cues:['Smooth and long','Same stroke count each length'],tired:'Skip if exhausted.'},
  'swim-ows':{why:'Open water is different from the pool: no walls, cold water, sighting, a wetsuit. Practise it before race day so nerves turn into habit.',feel:'Relaxed',cues:['Never alone — buddy or supervised','Breaststroke to reset is fine','Practise taking the wetsuit off'],tired:'10–15 min easy in the water still counts.'},
  'strength-A':{why:'Upper-body push & pull — chest, back, shoulders, arms. Builds the fit, balanced upper body you want, protects posture on long runs and gives swim power.',feel:'Hard but clean reps · stop with the reps in reserve shown',cues:['Rest 90" between big sets, 60" for accessories','Add weight when all sets hit the top of the rep range','Log weights in Garmin (strength activity) so stats can track progress'],tired:'Do the maintenance circuit (2 rounds).'},
  'strength-B':{why:'Full-body session with upper-body emphasis and run-safe leg work (moderate load) — durability without hurting quality runs.',feel:'Moderate legs, hard upper',cues:['Legs never to failure','Pullovers = lats for swimming','Copenhagen plank protects groin/adductors'],tired:'Upper exercises only.'},
  'strength-C':{why:'Upper-body volume plus rotator-cuff and shoulder-blade work — looks good and keeps swim shoulders healthy.',feel:'Moderate–hard',cues:['Slow lowering (2")','Light weights on rotator-cuff work','Hips square on renegade rows'],tired:'Do 2 sets of everything.'},
  'strength-M':{why:'Short maintenance circuit — keeps strength through recovery, taper and race weeks.',feel:'Easy–moderate, crisp',cues:['No soreness wanted this week'],tired:'One round.'},
  'bike-easy':{why:'Low-impact aerobic volume and recovery for the legs.',feel:'Zone 1–2 · RPE 2–3',cues:['High cadence, light gear','Keep it truly easy'],tired:'Skip it.'},
  'bike-endurance':{why:'Bike-specific aerobic endurance — the base that makes the 20 km race leg feel controlled.',feel:'Zone 2 · RPE 4 (tempo parts Zone 3)',cues:['Cadence 85–95 rpm','Drink every 15 minutes, eat on rides over 60 minutes'],tired:'Shorten to 45 minutes, all Zone 2.'},
  'bike-intervals':{why:'Raises bike threshold so race effort feels sustainable for 20 km.',feel:'Zone 3–4 · RPE 7–8',cues:['Steady effort through each rep — no surges','Stay aero or on the drops if you can'],tired:'Drop one rep.'},
  'bike-race':{why:'Full race simulation: pace, position and fuelling for Trakai.',feel:'Race effort · RPE 7–8',cues:['Use race kit and bottles','Eat a gel halfway'],tired:'Ride 10 km at race effort.'},
  brick:{why:'Bike → run teaches your legs to run after cycling (the "jelly legs" feeling) and practises transition 2.',feel:'As written',cues:['Set up transition before you start','First 5\' of the run feel awful — normal','Short quick steps'],tired:'Bike only.'},
};

// ================================================================== dates & paces
const pad=n=>String(n).padStart(2,'0');
const isoL=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return isoL(d)};
const today=isoL(new Date());
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return isoL(d)};
const dBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtD=s=>parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtLong=s=>parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vo2=v=>-4.6+0.182258*v+0.000104*v*v;
const pct=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vFor=o=>(-0.182258+Math.sqrt(0.182258**2+4*0.000104*(4.6+o)))/(2*0.000104);
const secKm=v=>60000/v;
const mmss=s=>{s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600);return h?h+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60):mmss(s)};
const toSec=t=>{if(!t||!/^\d/.test(t))return null;const p=String(t).split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]};
function raceTime(vd,d){let lo=5,hi=500;for(let i=0;i<60;i++){const t=(lo+hi)/2;(vo2(d/t)>vd*pct(t))?lo=t:hi=t}return (lo+hi)/2*60}
const vdotFrom=(d,sec)=>{const t=sec/60;return vo2(d/t)/pct(t)};
const RT=()=>(S.settings&&S.settings.raceTargets)||{};
const css=()=>+((S.settings||{}).css)||108;
function paces(){
  const st=S.settings||{};const vd=+st.vdot||41.5;const g=st.goals||{};const rt=RT();
  const gp=(k,d,fb)=>{const s=toSec(rt[k]&&rt[k].goal);return s?mmss(s/d):(fb)};
  return {vd,P:{E:mmss(secKm(vFor(vd*.70)))+'–'+mmss(secKm(vFor(vd*.62))),M:mmss(raceTime(vd,42195)/42.195),T:mmss(secKm(vFor(vd*.88))),I:mmss(secKm(vFor(vd*.975))),R:mmss(secKm(vFor(vd*1.05))),
    '10KG':g['10KG']||gp('mazeikiai',10,'4:42'),HMG:g.HMG||gp('riga',21.0975,'4:44'),MPG:g.MPG||gp('tallinn',42.195,'5:18'),
    SE:mmss(css()+15),SS:mmss(css()+7),SC:mmss(css()),SF:mmss(css()-6)}};
}
const TOK=/\{(E|M|T|I|R|10KG|HMG|MPG|SE|SS|SC|SF)\}/g;
const unitOf=k=>k[0]==='S'&&k.length===2?'/100 m':'/km';
function fill(t){const {P}=paces();return esc(t).replace(TOK,(_,k)=>`<b class="mono" style="color:var(--accent)">${P[k]}${unitOf(k)}</b>`)}
function plain(t){const {P}=paces();return String(t??'').replace(TOK,(_,k)=>P[k]+unitOf(k))}

// ================================================================== data helpers
const weekList=()=>Object.values(S.weeks).sort((a,b)=>a.weekStart<b.weekStart?-1:1);
function curIdx(){const L=weekList();const m=mondayOf(today);let i=L.findIndex(w=>w.weekStart===m);if(i<0)i=L.length&&today<L[0].weekStart?0:L.length-1;return Math.max(0,i)}
function nextRace(){return RACE_ORDER.map(k=>({k,...RT()[k]})).find(r=>r.date&&r.date>=today)}
const allWorkouts=()=>weekList().flatMap(w=>w.workouts||[]);
const estKm=x=>x.km||(x.sport==='run'?(x.dur||0)/6.1:0);
function plannedHrs(x){if(x.dur)return x.dur/60;if(x.sport==='race')return x.km?x.km*5.2/60:1.4;return 0}
function sportOf(x){return x.sport==='race'?(x.km?'run':'brick'):x.sport}
// match planned workouts to Garmin activities: same day, else ±1 day (shifted)
function matchAll(){
  const res={};
  for(const w of weekList()){
    const a=S.actuals[w.weekStart]; const acts=a?(a.activities||[]).map((x,i)=>({...x,_i:i})):null; const used=new Set();
    const okS=(p,x)=>{const s=p.sport;if(s==='race')return x.sport==='run'||x.sport==='multisport'||x.sport==='swim';if(s==='brick')return x.sport==='bike'||x.sport==='run';return x.sport===s};
    for(const p of (w.workouts||[]).slice().sort((a,b)=>a.date<b.date?-1:1)){
      if(p.date>today||(p.date===today&&!acts)){res[p.id]={st:'future'};continue}
      if(!acts){res[p.id]={st:'nodata'};continue}
      let hit=acts.find(x=>!used.has(x._i)&&x.date===p.date&&okS(p,x)),st='done';
      if(!hit&&p.date<today){hit=acts.find(x=>!used.has(x._i)&&Math.abs(dBetween(p.date,x.date))===1&&okS(p,x));st='shifted'}
      if(hit){used.add(hit._i);res[p.id]={st,act:hit}}else res[p.id]={st:p.date===today?'future':'missed'};
    }
  }
  return res;
}

// ================================================================== render root
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const nr=nextRace();
  document.getElementById('nextRace').innerHTML=nr?`${esc(nr.name.split(' ')[0])} in <b>${dBetween(today,nr.date)}</b> days`:'Season complete';

  const maxH=Math.max(...hrsBy.map(o=>SPORTS.reduce((a,s)=>a+o[s],0)),1);const sc=H/Math.ceil(maxH);
  const ci=curIdx();let g='';

  for(let h=0;h<=Math.ceil(maxH);h+=2){const y=top+H-h*sc;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="2" y="${y-3}" fill="var(--muted)" font-size="9" font-family="Figtree">${h}h</text>`}

        :`<rect x="${x}" y="${y+1}" width="${BW}" height="${Math.max(0,h-2)}" fill="${SP[s][1]}"/>`});
    g+=`<rect x="${x-2}" y="${top-4}" width="${BW+4}" height="${H+40}" fill="transparent" data-tip="${esc(tipT)}" style="cursor:pointer" onclick="S.weekIdx=${i};go('week')"/>`;

  // months
  let lastM='';L.forEach((w,i)=>{const d=parse(w.weekStart);const mm=d.toLocaleDateString('en-GB',{month:'short'});if(mm!==lastM){lastM=mm;const x=20+i*(BW+G);g+=`<text x="${x}" y="${bandY+36}" fill="var(--muted)" font-size="10" font-family="Figtree">${mm}${d.getMonth()===0?' ’'+String(d.getFullYear()).slice(2):''}</text>`}});
  // races
  RACE_ORDER.forEach(k=>{const r=RT()[k];if(!r)return;const wi=L.findIndex(w=>w.weekStart===mondayOf(r.date));if(wi<0)return;const x=20+wi*(BW+G)+BW/2+(dBetween(mondayOf(r.date),r.date)-3)*2;
    g+=`<line x1="${x}" x2="${x}" y1="14" y2="${top+H}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M${x},6 l9,4 -9,4z" fill="var(--accent)"/><text x="${x+11}" y="14" fill="var(--accent)" font-size="10.5" font-weight="600" font-family="Figtree" data-tip="${esc(r.name+' · '+fmtD(r.date)+' · target '+r.goal)}">${esc(r.name.split(' ')[0])}</text>`});

function woLine(x){return x?`${esc(x.title)}${x.km?' · '+x.km+' km':x.dur?' · '+x.dur+"'":''} — <span class="muted">${esc(plain(x.details||(x.steps||[]).map(s=>s[1]).join(' · '))).slice(0,170)}</span>`:'—'}

  if(!t){pv.innerHTML='<div class="err">Use a time like 44:30 or 1:37:00.</div>';return}
  const vNow=paces().vd;const need=vdotFrom(r.dist,t);const wk=Math.max(1,dBetween(today,r.date)/7);const per=(need-vNow)/wk;const pace=mmss(t/(r.dist/1000));
  const verdict=need<=vNow?['Already within your fitness','var(--good)']:per<=0.15?['Realistic with consistent training','var(--good)']:per<=0.25?['Ambitious — needs a near-perfect block','var(--warn)']:['Very unlikely in the time left','var(--crit)'];
  const pct=Math.min(100,vNow/need*100);
  pv.innerHTML=`<div class="tiles"><div class="tile"><div class="v" style="font-size:18px">${pace}</div><div class="l">per km</div></div><div class="tile"><div class="v" style="font-size:18px">${r1(need)}</div><div class="l">VDOT needed</div></div><div class="tile"><div class="v" style="font-size:18px">${per>0?'+'+r1(per,2):'0'}</div><div class="l">VDOT / week</div></div></div>
    <div class="bar" style="margin-top:10px"><i style="width:${pct}%;background:${verdict[1]}"></i></div><div class="small" style="color:${verdict[1]};margin-top:4px">● ${verdict[0]}</div><div class="tiny muted">Your VDOT now ${r1(vNow)} · ${Math.round(wk)} weeks to go · realistic gain 0.1–0.2 per week</div>`;
}
async function tgSave(k){
  const m=document.getElementById('tgMsg');const v=document.getElementById('tgIn').value.trim();const r=RT()[k];
  if(!v)return;if(r.dist&&toSec(r.goal)&&!toSec(v)){m.innerHTML='<span class="err">Use a time like 44:30.</span>';return}
  if(v===r.goal){closeSheet();return}
  try{const st=JSON.parse(JSON.stringify(S.settings||{}));const t=st.raceTargets[k];t.goal=v;t.history=[...(t.history||[]),{at:today,goal:v,reason:document.getElementById('tgWhy').value.trim()||'Changed by Tomas in the app'}];
    if(st.goals){const g={mazeikiai:'10KG',riga:'HMG',tallinn:'MPG'}[k];if(g)delete st.goals[g]}
    const {_id,...body}=st;await S.db.doc('settings/athlete').set({...body,updatedAt:new Date().toISOString()});
    await S.db.collection('notes').add({text:`Target changed: ${r.name} ${r.goal} → ${v}.`,createdAt:new Date().toISOString(),status:'open'});
    closeSheet();render();
  }catch(e){m.innerHTML=`<span class="err">${esc(e.message||e)}</span>`}
}

// ================================================================== install / upgrade
function mergeMs(old,neu){old=old||[];const byId=Object.fromEntries(old.map(x=>[x.id,x]));const out=neu.map(n=>byId[n.id]?{...n,doneAt:byId[n.id].doneAt||null}:n);old.forEach(o=>{if(!neu.find(n=>n.id===o.id))out.push(o)});return out}
async function installPlan(db,lm){
  try{
    const r=await fetch('plan.json');if(!r.ok)throw new Error('plan.json '+r.status);const plan=await r.json();const V=plan.version||1;
    const m=await db.doc('meta/install').get();const have=m.exists?(m.data().version||1):0;if(have>=V)return;
    const lease=await db.doc('meta/lock').acquire({holder:'install-'+Math.random(),ttlMs:180000});if(!lease.acquired)return;
    lm.classList.remove('hide');lm.textContent=have?'Upgrading your plan…':'Installing your season plan…';
    const s=await db.doc('settings/athlete').get();
    if(!s.exists)await db.doc('settings/athlete').set({...plan.settings,updatedAt:new Date().toISOString()});
    else if((s.data().version||1)<V){const o=s.data();const keepV=o.vdotHistory&&o.vdotHistory.length;
      await db.doc('settings/athlete').set({...plan.settings,...(keepV?{vdot:o.vdot,vdotHistory:o.vdotHistory}:{}),raceTargets:o.raceTargets||plan.settings.raceTargets,milestones:mergeMs(o.milestones,plan.settings.milestones),css:o.css||plan.settings.css,version:V,updatedAt:new Date().toISOString()})}
    for(let i=0;i<plan.weeks.length;i++){const w=plan.weeks[i];const ex=await db.doc('weeks/'+w.weekStart).get();
      const touched=ex.exists&&(ex.data().workouts||[]).some(x=>x.changedBy);
      if(!touched)await db.doc('weeks/'+w.weekStart).set(w);lm.textContent=`${have?'Upgrading':'Installing'} your plan… ${i+1}/${plan.weeks.length}`;await new Promise(r=>setTimeout(r,100))}
    await db.doc('meta/install').set({at:new Date().toISOString(),version:V,weeks:plan.weeks.length});
    lm.classList.add('hide');
  }catch(e){lm.classList.remove('hide');lm.textContent='Could not install plan: '+(e.message||e.code)+'. Open the page again to retry.'}
}

// ================================================================== data layer (Google Sheet via Apps Script)
const API='https://script.google.com/macros/s/AKfycbzTl61xanm3eVADzxO3NS2y95rYUJQRJ0FpktGRrivb1kIO-Uh_HJIdZbF52vOGIa90Yg/exec';
function getKey(){
  const m=(location.hash||'').match(/key=([A-Za-z0-9_-]+)/);
  if(m){try{localStorage.setItem('s2627key',m[1])}catch(e){};try{history.replaceState(null,'',location.pathname+'#week')}catch(e){};return m[1]}
  try{return localStorage.getItem('s2627key')}catch(e){return null}
}
const clone=o=>JSON.parse(JSON.stringify(o??null));
function mergeDeep(a,b){for(const k in b){const v=b[k];if(v&&v.__delete__){delete a[k];continue}if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))a[k]=mergeDeep(a[k],v);else a[k]=clone(v)}return a}
function sheetDb(KEY){
  const store={};const subs=[];let fromCache=true,loaded=false;
  try{const c=JSON.parse(localStorage.getItem('s2627cache')||'null');if(c)Object.assign(store,c)}catch(e){}
  const save=()=>{try{localStorage.setItem('s2627cache',JSON.stringify(store))}catch(e){}};
  const emit=()=>subs.forEach(s=>{try{s.fire()}catch(e){console.error(e)}});
  let pending=0;
  async function pull(){
    if(pending)return; const r=await fetch(API+'?key='+encodeURIComponent(KEY)+'&t='+Date.now());const j=await r.json();
    if(j.error)throw {code:'unauthorized',message:'This link\'s app key is not valid'};
    if(pending)return; for(const k in store)delete store[k]; (j.docs||[]).forEach(d=>store[d.path]=d.data);
    loaded=true;fromCache=false;save();emit();
  }
  async function post(ops){pending++;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:KEY,ops})});const j=await r.json();if(j.error)throw {code:'invalid_argument',message:j.error}}finally{pending--}}
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const snapDoc=p=>({id:p.split('/').pop(),exists:p in store,data:()=>store[p],metadata:{fromCache,hasPendingWrites:false}});
  const docRef=p=>({id:p.split('/').pop(),path:p,
    get:async()=>snapDoc(p),
    set:async d=>{store[p]=clone(d);save();emit();await post([{op:'set',path:p,data:d}])},
    update:async d=>{store[p]=mergeDeep(clone(store[p]||{}),d);save();emit();await post([{op:'update',path:p,data:d}])},
    delete:async()=>{delete store[p];save();emit();await post([{op:'delete',path:p}])},
    acquire:async()=>({acquired:true}),
    onSnapshot:(cb,err)=>{const s={fire:()=>cb(snapDoc(p)),err};subs.push(s);if(Object.keys(store).length)setTimeout(s.fire,0);return()=>{}}});
  const collRef=c=>({path:c,doc:id=>docRef(c+'/'+(id||rid())),add:async d=>{const r=docRef(c+'/'+rid());await r.set(d);return r},
    onSnapshot:(cb,err)=>{const depth=c.split('/').length+1;const s={fire:()=>{const docs=Object.keys(store).filter(k=>k.startsWith(c+'/')&&k.split('/').length===depth).sort().map(snapDoc);cb({docs,size:docs.length,empty:!docs.length,metadata:{fromCache},docChanges:()=>[]})},err};subs.push(s);if(Object.keys(store).length)setTimeout(s.fire,0);return()=>{}}});
  const fail=e=>subs.forEach(s=>s.err&&s.err(e));
  pull().catch(fail);
  setInterval(()=>pull().catch(()=>{}),60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull().catch(()=>{})});
  return {doc:docRef,collection:collRef,refresh:pull};
}
// ================================================================== boot
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
{const h=(location.hash||'').slice(1);if(['week','season','stats','review','garmin'].includes(h))S.tab=h}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['week','season','stats','review','garmin'].includes(h)&&h!==S.tab){S.tab=h;render()}});
render();
(async()=>{
  const lm=document.getElementById('loadMsg');
  const timer=setTimeout(()=>{lm.textContent='Your plan data can\'t be reached yet — check your connection.';lm.classList.remove('hide')},10000);
  const KEY=getKey();
  if(!KEY){clearTimeout(timer);lm.innerHTML='Open your personal install link once (the one with <b>#key=</b> at the end) to connect this phone to your plan.';return}
  const db=sheetDb(KEY);
  fetch('descriptions.json').then(r=>r.ok?r.json():null).then(j=>{if(j){S.desc=j;render()}}).catch(()=>{});
  S.db=db;let first=true;const done=()=>{if(first){first=false;clearTimeout(timer);if(!/Install|Upgrad/.test(lm.textContent))lm.classList.add('hide')}};
  const err=e=>{clearTimeout(timer);lm.classList.remove('hide');lm.textContent='Data error: '+(e.message||e.code)};
  const coll=(name,fn)=>db.collection(name).onSnapshot(snap=>{fn(snap.docs.filter(d=>d.exists).map(d=>({...d.data(),_id:d.id})));if(name==='weeks'&&(snap.docs.length||!snap.metadata.fromCache))done();render()},err);
  coll('weeks',a=>{S.weeks={};a.forEach(w=>S.weeks[w.weekStart||w._id]=w)});
  coll('suggestions',a=>S.suggestions=a);
  coll('actuals',a=>{S.actuals={};a.forEach(x=>S.actuals[x.weekStart||x._id]=x)});
  coll('metrics',a=>{S.metrics={};a.forEach(x=>S.metrics[x.weekStart||x._id]=x)});
  coll('notes',a=>S.notes=a);
  db.doc('meta/refresh').onSnapshot(d=>{S.refresh=d.exists?d.data():null;if(S.tab==='garmin')render()},()=>{});
  db.doc('settings/athlete').onSnapshot(d=>{S.settings=d.exists?d.data():null;render()},err);
})();
</script>
